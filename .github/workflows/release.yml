name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            release_platform: macos
            package_script: package:release:mac
            artifact_name: procontext-terminal-macos
          - os: windows-latest
            release_platform: windows
            package_script: package:release:win
            artifact_name: procontext-terminal-windows
          - os: ubuntu-latest
            release_platform: linux
            package_script: package:release:linux
            artifact_name: procontext-terminal-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validate release tag and credentials
        env:
          CSC_LINK: ${{ matrix.release_platform == 'macos' && secrets.MACOS_CSC_LINK || matrix.release_platform == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.release_platform == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.release_platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.release_platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.release_platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.release_platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node apps/desktop/scripts/validate-release-inputs.mjs --platform ${{ matrix.release_platform }} --package-json apps/desktop/package.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-system-deps.sh --package

      - name: Install dependencies
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify Electron binary
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          pnpm electron:install
          pnpm electron:verify

      - name: Reject npm lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json must not be committed; use pnpm-lock.yaml."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Electron E2E tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Electron E2E tests with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm test:e2e

      - name: Build release artifacts
        env:
          CSC_LINK: ${{ matrix.release_platform == 'macos' && secrets.MACOS_CSC_LINK || matrix.release_platform == 'windows' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.release_platform == 'macos' && secrets.MACOS_CSC_KEY_PASSWORD || matrix.release_platform == 'windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.release_platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.release_platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.release_platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm ${{ matrix.package_script }}

      - name: Verify native PTY packaging
        run: pnpm package:verify

      - name: Packaged app smoke
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.package.config.ts

      - name: Packaged app smoke with virtual display
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm exec vitest run -c vitest.package.config.ts

      - name: Verify and collect distributable installers
        run: |
          rm -rf apps/desktop/release-artifacts
          verify_args=(
            apps/desktop/scripts/verify-release-artifacts.mjs
            --platform ${{ matrix.release_platform }}
            --dist apps/desktop/dist
            --package-json apps/desktop/package.json
            --require-signature
            --copy-to apps/desktop/release-artifacts
          )
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node "${verify_args[@]}"
          else
            node "${verify_args[@]}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/release-artifacts/*
          if-no-files-found: error

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: apps/desktop/release-artifacts/*

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in apps/desktop/release-artifacts/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
