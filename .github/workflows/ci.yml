name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-system-deps.sh

      - name: Install dependencies
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Verify Electron binary
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          pnpm electron:install
          pnpm electron:verify

      - name: Verify PowerShell Core
        run: pwsh --version

      - name: Reject npm lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json must not be committed; use pnpm-lock.yaml."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Type check
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Electron E2E tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Electron E2E tests with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm test:e2e

      - name: Build unpacked packaged app
        run: |
          pnpm --filter @terminal/desktop package:clean
          pnpm --filter @terminal/desktop exec electron-builder --dir --publish never

      - name: Verify packaged native PTY layout
        run: pnpm package:verify

      - name: Packaged app smoke
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        run: pnpm exec vitest run -c vitest.package.config.ts

      - name: Packaged app smoke with virtual display
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm exec vitest run -c vitest.package.config.ts
